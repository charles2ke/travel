name: Update README

on:
  push:
    branches: ["main"]

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Regenerate README from codebase
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate README
        run: node .github/scripts/update-readme.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: auto-update README [skip ci]" && git push
