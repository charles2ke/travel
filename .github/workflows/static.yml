name: Deploy to GitHub Pages

on:
  # Deploy only after the CI workflow succeeds on main.
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

  # Allow manual deploys from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment; do NOT cancel in-progress deploys so
# production deployments always complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: run tests only for manual deploys ────────────────────────────────
  test-manual:
    name: Unit Tests (manual gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test

  # ── Job 2: deploy ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: test-manual
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (needs.test-manual.result == 'success' || needs.test-manual.result == 'skipped'))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy only the web-facing files (excludes node_modules, coverage, etc.)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
