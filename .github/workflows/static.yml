# Deploy static content to GitHub Pages
# Tests must pass before a deployment is created.
name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: ["main"]

  # Allow manual deploys from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment; do NOT cancel in-progress deploys so
# production deployments always complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: run unit tests ───────────────────────────────────────────────────
  test:
    name: Unit Tests (gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test

  # ── Job 2: deploy (only runs when tests pass) ───────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy only the web-facing files (excludes node_modules, coverage, etc.)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
