name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch/PR so stale runs don't block
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Jest unit tests ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest unit tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 14

  # ── Job 2: Playwright smoke tests + screenshots ─────────────────────────────
  smoke-tests:
    name: Smoke Tests + Screenshots (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Comment on PR with screenshot links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const prNumber = context.payload.pull_request.number;
            const status = '${{ job.status }}' === 'success' ? '✅ passed' : '❌ failed';
            const body = [
              `## 📸 Playwright Smoke Tests ${status}`,
              '',
              `Screenshots and reports are available as CI artifacts:`,
              `| Artifact | Link |`,
              `|---|---|`,
              `| 📷 Full-page screenshots (all pages × viewports) | [screenshots](${runUrl}#artifacts) |`,
              `| 📊 Playwright HTML report | [playwright-report](${runUrl}#artifacts) |`,
              `| 🔬 Test traces (on failure) | [playwright-traces](${runUrl}#artifacts) |`,
              '',
              `> [View full workflow run ↗](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });

  # ── Job 3: Package site artifact ────────────────────────────────────────────
  package:
    name: Package site artifact
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site package
        run: |
          zip -r site-package.zip \
            $(find . -maxdepth 1 -name '*.html' | sort) \
            assets/ \
            README.md \
            LICENSE

      - name: Upload site package
        uses: actions/upload-artifact@v4
        with:
          name: site-package
          path: site-package.zip
          retention-days: 30

